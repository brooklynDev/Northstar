name: Build and Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          include-prerelease: true

      - name: Build publish artifacts
        run: make publish

      - name: Prepare release asset names
        run: |
          cp "artifacts/osx-arm64/Northstar Explorer.zip" "artifacts/osx-arm64/Northstar-Explorer-osx-arm64.zip"
          cp "artifacts/osx-x64/Northstar Explorer.zip" "artifacts/osx-x64/Northstar-Explorer-osx-x64.zip"

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Northstar Build ${{ github.run_number }}
          prerelease: false
          make_latest: true
          target_commitish: ${{ github.sha }}
          generate_release_notes: false
          fail_on_unmatched_files: true
          overwrite_files: true
          body: |
            Automated build for commit `${{ github.sha }}` on `${{ github.ref_name }}`.
          files: |
            artifacts/osx-arm64/Northstar-Explorer-osx-arm64.zip
            artifacts/osx-x64/Northstar-Explorer-osx-x64.zip
